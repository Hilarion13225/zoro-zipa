# À copier sur le VPS : /etc/nginx/sites-available/zoro-zipa.it.com
# puis : ln -s /etc/nginx/sites-available/zoro-zipa.it.com /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name zoro-zipa.it.com www.zoro-zipa.it.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8081/uploads/;
    }

    client_max_body_size 20M;
}

# Après "certbot --nginx -d zoro-zipa.it.com -d www.zoro-zipa.it.com",
# certbot ajoutera automatiquement le bloc HTTPS (port 443).
