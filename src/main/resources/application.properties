spring.application.name=zoro-zipa
server.port=8081

# H2 file database so the catalogue survives restarts in development.
spring.datasource.url=jdbc:h2:file:./data/zoro-zipa;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Email configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=contact@zorozipa.com

# Admin email for reservation notifications
app.email.admin=bruno488@gmail.com

# File storage configuration
app.file-storage.upload-dir=${APP_FILE_STORAGE_UPLOAD_DIR:uploads}

# Static resources configuration for serving uploads
spring.web.resources.static-locations=file:${APP_FILE_STORAGE_UPLOAD_DIR:uploads}/,classpath:/static/
spring.mvc.static-path-pattern=/static/**
